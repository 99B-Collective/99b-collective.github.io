<style>
/* Layout: a wide, symmetrical page. On laptops sections sit side by side in pairs; on phones they stack.
   Each section borrows a palette from a different Wes Anderson film: hotel pink, scout-camp mustard,
   diving-team blue and red, train-carriage blue and saffron, magazine cream and lavender. */
:root{
  color-scheme:light;
  --bg:#DDE9F3; --paper:#FDF7EE; --ink:#3A2440; --muted:#6E5C74;
  --pink:#F3C9D2; --pink-deep:#C24A72;
  --mustard:#F1D58A; --mustard-deep:#A9761C;
  --sky:#A9CBEA; --red:#C8433A;
  --navy:#2F4A7A; --saffron:#E7A645;
  --lav:#CDBEEB; --cream:#F6E6C8;
  --line:rgba(58,36,64,.28); --shadow:rgba(58,36,64,.14);
  --on-tone:#2A1A30; --on-tone-muted:#5A4560; --card:#FDF7EE;
  --band-a:#EDE4F6; --band-b:#F8EDE2;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#22283F;--paper:#2F3552;--ink:#F4E9F0;--muted:#C4BCD4;--line:rgba(244,233,240,.26);--shadow:rgba(0,0,0,.3);
  --pink:#E7B5C3;--mustard:#E6C677;--sky:#97BADF;--lav:#B9A8E0;--cream:#E9D6B3;--pink-deep:#F08DAE;--red:#EE7F75;--saffron:#F0B95E;--mustard-deep:#E6C677;--band-a:#2A3150;--band-b:#2C2E48}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#22283F;--paper:#2F3552;--ink:#F4E9F0;--muted:#C4BCD4;--line:rgba(244,233,240,.26);--shadow:rgba(0,0,0,.3);
  --pink:#E7B5C3;--mustard:#E6C677;--sky:#97BADF;--lav:#B9A8E0;--cream:#E9D6B3;--pink-deep:#F08DAE;--red:#EE7F75;--saffron:#F0B95E;--mustard-deep:#E6C677;--band-a:#2A3150;--band-b:#2C2E48}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;overflow-x:clip;-webkit-font-smoothing:antialiased}
::selection{background:var(--pink);color:#2A1A30}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,48px);padding-block:28px 80px;display:grid;gap:clamp(40px,5vw,64px)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.1}
.label{font-family:var(--sans);text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;font-weight:500;color:var(--muted)}
a{color:var(--pink-deep)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink-deep);outline-offset:3px}
img{max-width:100%}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--on-tone);background:var(--card);color:var(--on-tone);padding:10px 18px;text-transform:uppercase;letter-spacing:.16em;font-size:.76rem;font-weight:500;text-decoration:none;cursor:pointer;border-radius:2px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.solid{background:var(--on-tone);color:#FDF7EE}
.btn.small{padding:6px 12px;font-size:.66rem}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;transform:none}

/* ---------- Masthead ---------- */
.masthead{display:grid;gap:22px;min-width:0}
.masthead>*{min-width:0}
.awning{height:34px;background:repeating-linear-gradient(90deg,var(--sky) 0 28px,var(--paper) 28px 56px,var(--pink) 56px 84px,var(--paper) 84px 112px,var(--mustard) 112px 140px,var(--paper) 140px 168px);border-radius:0 0 50% 50%/0 0 100% 100%;box-shadow:0 6px 0 var(--shadow)}
.hero{display:grid;gap:18px}
.titlecard{border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-8px;background:var(--paper);padding:clamp(32px,5vw,56px) 20px;display:grid;gap:12px;justify-items:center;align-content:center;text-align:center}
.titlecard h1{font-size:clamp(2.6rem,8vw,5.2rem)}
.titlecard h1 em{font-style:italic;color:var(--pink-deep)}
.rule{display:flex;align-items:center;gap:12px;width:min(320px,80%)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor;opacity:.8}
.rule span{font-family:var(--display);font-size:1.1rem;color:var(--saffron)}
.marquee{background:#2F3A63;color:#FDF7EE;padding:26px 20px;display:grid;gap:10px;justify-items:center;align-content:center;text-align:center;position:relative;border-radius:3px}
.marquee::before,.marquee::after{content:"";position:absolute;left:8px;right:8px;height:10px;background:radial-gradient(circle,#F2C35E 0 3px,transparent 3.5px);background-size:18px 10px;animation:twinkle 1.6s steps(2) infinite}
.marquee::before{top:4px;animation:chase 1.4s linear infinite}.marquee::after{bottom:4px;animation:chase 1.4s linear infinite reverse}
@keyframes chase{to{background-position-x:18px}}
.js .titlecard,.js .marquee{opacity:0;transform:translateY(14px)}
.ready .titlecard,.ready .marquee{opacity:1;transform:none;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.ready .marquee{transition-delay:.18s}
.titlecard h1 em{display:inline-block}
.ready .titlecard h1 em{animation:swing 1.1s cubic-bezier(.3,1.5,.5,1) .5s both}
@keyframes swing{from{transform:rotate(-8deg) translateY(-6px)}to{transform:none}}
@keyframes twinkle{50%{opacity:.35}}
.marquee .label{color:#C9D9F2}
.marquee strong{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.3rem);font-weight:600;letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.marquee .btn{border-color:#FDF7EE;background:transparent;color:#FDF7EE}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-block:1.5px solid var(--ink);display:flex;align-items:center;gap:6px;padding:0 6px}
.nav .mark{flex:none;font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--ink);text-decoration:none;padding:8px 10px 8px 4px;border-right:1.5px solid var(--ink);max-width:0;overflow:hidden;opacity:0;padding-inline:0;border-right-width:0;transition:max-width .35s ease,opacity .35s ease,padding .35s ease}
.nav.stuck .mark{max-width:80px;opacity:1;padding-inline:4px 12px;border-right-width:1.5px}
.nav .mark em{color:var(--pink-deep)}
.nav .navlinks{display:flex;gap:2px 20px;overflow-x:auto;scrollbar-width:none;padding:11px 4px;min-width:0;flex:1;scroll-padding-inline:24px}
.nav .navlinks::-webkit-scrollbar{display:none}
@media (min-width:1100px){.nav .navlinks{justify-content:center}}
.nav .navlinks a{flex:none;color:var(--ink);text-decoration:none;font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;padding-bottom:2px;background:linear-gradient(var(--pink-deep),var(--pink-deep)) left bottom/0 1.5px no-repeat;transition:background-size .3s ease,color .2s}
.nav .navlinks a:hover,.nav .navlinks a[aria-current="true"]{background-size:100% 1.5px}
.nav .navlinks a[aria-current="true"]{color:var(--pink-deep)}

/* ---------- Sections ---------- */
section{scroll-margin-top:72px;display:grid;gap:20px;align-content:start;min-width:0}
.wrap>section:not(.bleed),.pair>section{width:min(100%,900px);margin-inline:auto}
.pair{display:grid;gap:clamp(48px,7vw,80px)}
.t-pink{--tone:var(--pink);--tone-deep:var(--pink-deep)}
.t-mustard{--tone:var(--mustard);--tone-deep:var(--mustard-deep)}
.t-sky{--tone:var(--sky);--tone-deep:var(--red)}
.t-navy{--tone:var(--sky);--tone-deep:var(--saffron)}
.t-lav{--tone:var(--lav);--tone-deep:var(--pink-deep)}
.t-cream{--tone:var(--cream);--tone-deep:var(--mustard-deep)}
.head{display:grid;justify-items:center;text-align:center;gap:6px}
.head h2{font-size:clamp(1.8rem,4vw,2.5rem)}
.head h2::after{content:"";display:block;width:44px;height:3px;background:var(--tone-deep);margin:12px auto 0}
.head p{margin:2px 0 0;max-width:56ch;color:var(--muted)}
.panel{background:var(--tone);color:var(--on-tone);border:1.5px solid var(--on-tone);padding:24px clamp(18px,3vw,30px);display:grid;gap:18px;box-shadow:6px 6px 0 var(--shadow);min-width:0}
.panel .label,.panel .meta,.panel .fine{color:var(--on-tone-muted)}
.panel.plain{background:var(--paper);color:var(--ink)}
.panel.plain .label,.panel.plain .fine{color:var(--muted)}

/* Now showing */
.showing h3{font-size:clamp(1.7rem,4vw,2.4rem)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 20px;margin:0}
.facts div{display:grid;gap:2px;min-width:0}
.facts dt{font-size:.66rem;text-transform:uppercase;letter-spacing:.2em;color:var(--on-tone-muted)}
.facts dd{margin:0;font-weight:500}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--on-tone);text-align:center;background:var(--card)}
.countdown div{padding:12px 4px;display:grid}
.countdown div+div{border-left:1.5px solid var(--on-tone)}
.countdown b{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.2rem);font-variant-numeric:tabular-nums;line-height:1}
.countdown span{font-size:.6rem;text-transform:uppercase;letter-spacing:.2em;color:var(--on-tone-muted)}
.status-line{text-align:center;font-family:var(--display);font-style:italic;font-size:1.15rem;margin:0}
.legal{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;border:1px dashed var(--on-tone);padding:6px 10px;justify-self:start}
.row{display:flex;flex-wrap:wrap;gap:10px}
.hint{font-size:.82rem;margin:0;color:var(--on-tone-muted)}
.empty{text-align:center;display:grid;gap:8px;justify-items:center;padding:12px 0}
.empty .big{font-family:var(--display);font-size:1.5rem;font-style:italic}

/* Programme: a strip of film */
.wrap>*{min-width:0}
.strip-wrap{position:relative;min-width:0}
.strip{--holes:var(--bg);list-style:none;margin:0;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:22px;padding:34px 22px;background:#2F3A63;border-radius:3px;cursor:grab;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
  background-image:radial-gradient(circle at 50% 50%,var(--holes) 0 5px,transparent 5.5px),radial-gradient(circle at 50% 50%,var(--holes) 0 5px,transparent 5.5px);
  background-size:26px 14px,26px 14px;background-repeat:repeat-x,repeat-x;background-position:6px 9px,6px calc(100% - 9px)}
.strip:focus-visible{outline:2px solid var(--saffron);outline-offset:3px}
.frame{flex:0 0 clamp(220px,26vw,260px);scroll-snap-align:start;min-height:330px;border:1.5px solid #2A1A30;padding:16px 16px 14px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:8px;color:#2A1A30;position:relative;transition:transform .25s ease}
.frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(42,26,48,.4);pointer-events:none}
.frame:hover{transform:translateY(-4px) rotate(-.6deg)}
.frame.c0{background:#F3C9D2}.frame.c1{background:#F1D58A}.frame.c2{background:#A9CBEA}.frame.c3{background:#CDBEEB}.frame.c4{background:#F6E6C8}.frame.c5{background:#F4B8A6}
.frame.more{background:#FDF7EE}
.frame.is-next{box-shadow:0 0 0 3px #E7A645}
.flag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#E7A645;color:#2A1A30;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;padding:3px 10px;border:1.5px solid #2A1A30;white-space:nowrap}
.fdate{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid #2A1A30;padding-bottom:8px}
.fdate b{font-family:var(--display);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.fdate span{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase}
.frame h3{font-size:1.35rem;overflow-wrap:anywhere}
.fmeta{font-size:.8rem;color:#5A4560;line-height:1.45}
.ftheme{justify-self:start;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;border:1px solid #2A1A30;padding:2px 8px}
.fcal .btn{width:100%}
.strip>li:first-child{margin-left:auto}.strip>li:last-child{margin-right:auto}
.strip-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1.5px solid #2A1A30;background:#FDF7EE;color:#2A1A30;font-size:1.5rem;line-height:1;cursor:pointer;display:none}
.strip-nav.prev{left:-14px}.strip-nav.next{right:-14px}
@media (hover:hover) and (min-width:760px){.strip-nav{display:block}}
.chips{margin-bottom:4px}

/* Register */
.register{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1.5px solid var(--on-tone);border-left:6px solid var(--tone-deep);padding:12px 14px}
.register div{display:grid;gap:2px;min-width:0;flex:1 1 220px}
.register b{font-family:var(--display);font-size:1.15rem}
.register span{font-size:.85rem;color:var(--on-tone-muted)}
.marquee .btn.reg{background:#E7A645;border-color:#E7A645;color:#2A1A30}

/* Interludes */
.interlude{width:min(100%,960px);margin-inline:auto;display:grid;gap:12px;justify-items:center}
.interlude-cap{margin:0;font-family:var(--display);font-style:italic;font-size:1.1rem;color:var(--muted);text-align:center}

/* Football ground scene */
.scene{position:relative;border:1.5px solid var(--on-tone);border-radius:3px;overflow:hidden;aspect-ratio:800/340;max-width:100%;box-shadow:0 24px 40px -24px rgba(42,26,48,.55)}
.scene svg{display:block;width:100%;height:100%}
@media (max-width:600px){.scene{aspect-ratio:16/10}.scene-tag{font-size:.5rem;padding:1px 6px}}
.scene-tag{position:absolute;right:8px;bottom:8px;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;background:rgba(253,247,238,.85);color:#3A2440;padding:2px 8px}
.layer{transition:transform .6s cubic-bezier(.2,.7,.2,1);transform:translateX(calc(var(--px,0) * var(--d) * 1px))}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.sun{animation:sink 12s ease-in-out infinite alternate}
@keyframes sink{from{transform:translateY(-6px)}to{transform:translateY(12px)}}
.flood{animation:flood 3.5s ease-in-out infinite alternate}
@keyframes flood{from{opacity:.55}to{opacity:1}}
.birds{animation:birds 26s linear infinite}
@keyframes birds{from{transform:translate(-160px,70px)}to{transform:translate(860px,30px)}}
.ballpath{animation:bpath 9s ease-in-out infinite}
@keyframes bpath{0%,100%{transform:translateX(190px)}50%{transform:translateX(610px)}}
.ballhop{animation:bhop .9s infinite}
@keyframes bhop{0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-34px);animation-timing-function:cubic-bezier(.6,0,.8,.3)}}
.bshadow{transform-box:fill-box;transform-origin:center;animation:bshad .9s infinite}
@keyframes bshad{0%,100%{transform:scale(1);opacity:.32}50%{transform:scale(.55);opacity:.14}}
.ballroll{animation:broll 9s ease-in-out infinite}
@keyframes broll{0%,100%{transform:rotate(0)}50%{transform:rotate(1080deg)}}
.pent{fill:#2A1A30}
.seam{stroke:#8C8098;stroke-width:1.2}

/* Walking to 99B, folded paper */
.walk .street{position:relative;width:100%;aspect-ratio:960/240;max-width:100%}
.walk .pscene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.walk .pscene.front{z-index:2;pointer-events:none}
.psun{animation:psun 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes psun{to{transform:rotate(360deg)}}
.ptree{transform-box:fill-box;transform-origin:50% 100%;animation:ptree 6s ease-in-out infinite alternate}
@keyframes ptree{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.cranes{animation:fly 34s linear infinite}
.cranes.slow{animation-duration:46s;animation-delay:-20s}
@keyframes fly{from{transform:translate(-60px,64px)}to{transform:translate(1020px,30px)}}
.cr{animation:glide 3s ease-in-out infinite alternate}
.cr.c2{animation-delay:-1.4s}
@keyframes glide{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
.crane .wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .9s ease-in-out infinite alternate}
.crane .w2{animation-delay:-.45s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.35)}}
.pwalker{position:absolute;bottom:10%;left:-7%;width:calc(7% * var(--s));z-index:1;animation:pwalk var(--d) linear infinite;animation-delay:var(--delay)}
.pwalker svg{display:block;width:100%;height:auto;overflow:visible;animation:step .42s ease-in-out infinite alternate}
.pleg{transform-box:fill-box;transform-origin:50% 0}
.pl1{animation:legA .42s ease-in-out infinite alternate}.pl2{animation:legB .42s ease-in-out infinite alternate}
.pcup .steam{animation:steam 1.6s ease-in-out infinite}
@keyframes pwalk{0%{left:-7%;opacity:0}4%{opacity:1}92%{opacity:1}100%{left:86%;opacity:0}}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-3%)}}
@keyframes legA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes legB{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(2px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.pwalker{left:calc(var(--delay) * -4.5%)}}

/* Depth: card lift and tilt */
.wrap{position:relative;z-index:1}
.panel{box-shadow:0 28px 50px -30px rgba(42,26,48,.5),6px 6px 0 var(--shadow)}
.marquee{box-shadow:0 30px 50px -30px rgba(20,16,40,.6)}
.marquee::before,.marquee::after{filter:drop-shadow(0 0 3px #F2C35E)}
.titlecard{box-shadow:0 30px 60px -36px rgba(42,26,48,.5)}
.frame{box-shadow:0 18px 26px -14px rgba(0,0,0,.55)}
.tiltable{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;will-change:transform}
.tiltable.tilting{transition:transform .08s linear}
.tiltable.tilting{background-image:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.45),rgba(255,255,255,0) 50%)}

/* Scroll reveal */
.js section.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js section.reveal.in{opacity:1;transform:none}

/* Full-width bands */
.bleed{margin-inline:calc(50% - 50vw);padding-inline:max(clamp(16px,4vw,48px),calc(50vw - 590px));padding-block:clamp(44px,6vw,72px);background:var(--band);position:relative}
.bleed::before,.bleed::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 50% 0,var(--bg) 0 6px,transparent 6.5px) 0 0/22px 10px repeat-x}
.bleed::before{top:0}.bleed::after{bottom:0;transform:scaleY(-1)}
#programme.bleed{--band:var(--band-a)}
#charter.bleed{--band:var(--band-b)}
.bleed .strip{--holes:var(--band-a)}

/* Countdown tick */
.countdown b{display:inline-block}
.countdown b.tickflip{animation:tickflip .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes tickflip{from{transform:translateY(-35%) rotateX(70deg);opacity:.2}to{transform:none;opacity:1}}

/* Phone action bar */
.dock{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;background:#2F3A63;color:#FDF7EE;padding:10px 10px 10px 14px;border-radius:4px;box-shadow:0 10px 30px rgba(20,16,40,.3);transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.dock.show{transform:none}
.dock div{display:grid;min-width:0;flex:1;line-height:1.25}
.dock b{font-family:var(--display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock span{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#C9D9F2}
.dock .btn{flex:none;background:#E7A645;border-color:#E7A645;color:#2A1A30;padding:9px 12px;font-size:.66rem}
@media (min-width:760px){.dock{display:none}}

/* Archive layout */
.arch-grid{display:grid;gap:28px}
@media (min-width:900px){.arch-grid.has-photo{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:start}.arch-grid.has-photo .cards{grid-template-columns:repeat(auto-fill,minmax(170px,220px))}}
.polaroid{transition:transform .4s ease}
.polaroid:hover{transform:rotate(0) scale(1.01)}

/* Finding us */
.finding{display:grid;gap:2px;border:1.5px dashed var(--on-tone);background:var(--card);padding:12px 14px}
.finding b{font-family:var(--display);font-size:1.3rem}
.finding span:not(.label){font-size:.88rem}
.finding p{margin:6px 0 0;font-size:.9rem}

/* Glossary drawer */
.gloss-wrap{border:1.5px solid var(--ink);background:var(--paper)}
.gloss-wrap summary{list-style:none;cursor:pointer;display:grid;justify-items:center;text-align:center;gap:4px;padding:22px 48px;position:relative}
.gloss-wrap summary::-webkit-details-marker{display:none}
.gloss-wrap summary::after{content:"+";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:1.8rem;color:var(--tone-deep);transition:transform .25s}
.gloss-wrap[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.gtitle{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3.5vw,2rem)}
.gsub{color:var(--muted);font-size:.92rem;max-width:52ch}
.gloss-wrap .glossary{padding:0 18px 22px}

/* Archive tally */
.tally{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tally div{display:grid;justify-items:center;min-width:120px;border:1.5px solid var(--ink);background:var(--paper);padding:10px 16px}
.tally b{font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card .came{justify-self:center;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;background:var(--on-tone);color:#FDF7EE;padding:2px 8px}

/* Opening leader */
.leader{position:fixed;inset:0;z-index:50;background:#2F3A63;display:grid;place-items:center;transition:opacity .5s ease}
.leader.out{opacity:0;pointer-events:none}
.leader .dial{position:relative;width:min(62vmin,420px);aspect-ratio:1;border-radius:50%;border:3px solid #FDF7EE;display:grid;place-items:center;overflow:hidden}
.leader .dial::before{content:"";position:absolute;inset:0;background:conic-gradient(rgba(253,247,238,.28) var(--sweep,0deg),transparent 0)}
.leader .dial::after{content:"";position:absolute;inset:12%;border-radius:50%;border:2px solid rgba(253,247,238,.7)}
.leader .cross{position:absolute;inset:0;background:linear-gradient(#FDF7EE,#FDF7EE) center/2px 100% no-repeat,linear-gradient(#FDF7EE,#FDF7EE) center/100% 2px no-repeat;opacity:.55}
.leader .num{position:relative;font-family:var(--display);font-size:min(30vmin,200px);color:#FDF7EE;line-height:1}
.leader .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:24px;background:transparent;border:1.5px solid #FDF7EE;color:#FDF7EE;padding:8px 16px;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;cursor:pointer}
.leader .cap{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#C9D9F2;letter-spacing:.3em;text-transform:uppercase;font-size:.7rem}

/* Programme (list styles, kept for reuse) */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1.5px solid var(--on-tone);background:transparent;color:var(--on-tone);padding:5px 14px;border-radius:999px;font-size:.78rem;letter-spacing:.08em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--on-tone);color:#FDF7EE}
.reel{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--on-tone)}
.reel li{display:grid;grid-template-columns:68px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(42,26,48,.25);align-items:start}
.date-stamp{border:1.5px solid var(--on-tone);text-align:center;padding:6px 0;background:var(--card);line-height:1.1}
.date-stamp b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.date-stamp span{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase}
.reel h3{font-size:1.25rem}
.reel .row{margin-top:8px}
.meta{font-size:.82rem}

/* Suggestion box */
.telegram{border-top:8px solid var(--red)}
.telegram h3{font-size:1.5rem}
.telegram p{margin:0}
.telegram .btn{justify-self:start}
.checker form{display:flex;flex-wrap:wrap;gap:10px}
.checker input{flex:1 1 200px;min-width:0;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:10px 12px;border-radius:2px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.82rem;border:1.5px solid var(--ink);padding:6px 12px;text-decoration:none;color:var(--ink);background:var(--bg)}
.links a:hover{background:var(--sky);color:var(--on-tone)}
.rules{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.92rem}

/* Ticket booth */
.booth{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:760px){.booth{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}
.screen{height:10px;border-radius:50% 50% 0 0/100% 100% 0 0;background:var(--saffron);margin-bottom:14px;position:relative}
.screen::after{content:"SCREEN";position:absolute;inset:12px 0 auto;text-align:center;font-size:.6rem;letter-spacing:.4em;color:var(--on-tone-muted)}
.seats{display:grid;gap:6px;padding-top:16px;justify-content:center}
.seat-row{display:grid;grid-template-columns:16px repeat(4,1fr) 14px repeat(4,1fr);gap:6px;align-items:center}
.seat-row>span{font-size:.65rem;text-align:center}
.seat{width:30px;height:28px;border:1.5px solid var(--on-tone);background:var(--card);color:var(--on-tone);border-radius:6px 6px 3px 3px;cursor:pointer;padding:0;font-size:.6rem}
.seat[aria-pressed="true"]{background:#2F4A7A;border-color:#2F4A7A;color:#FDF7EE}
.field{display:grid;gap:4px}
.field input{background:var(--card);color:var(--on-tone);border:1.5px solid rgba(42,26,48,.35);padding:10px 12px;border-radius:2px;width:100%;min-width:0}
.ticket{background:#2F4A7A;color:#FDF2DE;display:grid;grid-template-columns:minmax(0,1fr) 92px;position:relative;filter:drop-shadow(0 6px 0 rgba(42,26,48,.2))}
.ticket::before,.ticket::after{content:"";position:absolute;right:92px;width:18px;height:18px;border-radius:50%;background:var(--tone);transform:translateX(50%)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket .main{padding:18px 16px;display:grid;gap:6px;border-right:2px dashed rgba(253,242,222,.55);min-width:0}
.ticket .main small{letter-spacing:.24em;text-transform:uppercase;font-size:.6rem;color:#F2C35E}
.ticket .main strong{font-family:var(--display);font-size:1.35rem;line-height:1.15;overflow-wrap:anywhere}
.ticket .stub{display:grid;place-items:center;text-align:center;padding:10px 6px;gap:4px;background:#E7A645;color:#2A1A30}
.ticket .stub b{font-family:var(--display);font-size:1.7rem;line-height:1}
.ticket .stub small{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase}
.fine{font-size:.78rem;margin:0}

/* Bring a friend */
.note{background:var(--card);border:1.5px solid var(--on-tone);padding:14px 16px;font-family:var(--display);font-style:italic;font-size:1.05rem;line-height:1.5;overflow-wrap:anywhere;position:relative}
.note::before{content:"";position:absolute;top:-1.5px;left:18px;width:40px;height:4px;background:var(--tone-deep)}

/* After the film */
.qcard{background:var(--card);border:1.5px solid var(--on-tone);min-height:170px;padding:22px 20px;display:grid;align-content:center;justify-items:center;text-align:center;gap:10px;box-shadow:4px 4px 0 var(--shadow)}
.qcard p{margin:0;font-family:var(--display);font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.3;max-width:28ch;text-wrap:balance}
.qcard .label{color:var(--on-tone-muted)}

/* Archive photos */
.photos{display:grid;gap:12px;margin-top:8px}
.photo-row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.polaroid{margin:0;background:#FDFBF6;padding:12px 12px 16px;border:1px solid rgba(42,26,48,.2);box-shadow:0 8px 18px var(--shadow);transform:rotate(var(--tilt));max-width:min(640px,100%);display:grid;gap:10px;color:#2A1A30}
.polaroid img{display:block;width:100%;height:auto}
.polaroid figcaption{font-family:var(--display);font-style:italic;text-align:center;font-size:1rem}
.polaroid figcaption b{font-style:normal}

/* Join the crew */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.role{border:1.5px solid var(--on-tone);background:var(--card);color:var(--on-tone);padding:14px 16px;text-align:left;cursor:pointer;display:grid;gap:4px;position:relative}
.role b{font-family:var(--display);font-size:1.15rem}
.role span{font-size:.86rem;line-height:1.45}
.role[aria-pressed="true"]{background:var(--on-tone);color:#FDF7EE}
.role[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;font-weight:600;color:#E7A645}

/* Bingo */
.bingo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sq{aspect-ratio:1;min-width:0;border:1.5px solid var(--on-tone);background:var(--card);color:var(--on-tone);padding:6px;font-size:clamp(.62rem,1.6vw,.85rem);line-height:1.25;cursor:pointer;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;overflow-wrap:anywhere}
.sq[aria-pressed="true"]{background:#2F4A7A;color:#FDF7EE;border-color:#2F4A7A}
.sq[aria-pressed="true"]::after{content:"";position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:#E7A645}
@media (min-width:900px){.bingo{max-width:720px;margin-inline:auto;width:100%}}

/* Glossary flip cards */
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.flip{perspective:900px;border:0;background:none;padding:0;cursor:pointer;text-align:center;min-height:200px;color:var(--on-tone)}
.flip-inner{position:relative;display:grid;height:100%;min-height:200px;transition:transform .5s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--on-tone);padding:18px 16px;display:grid;align-content:center;gap:8px;box-shadow:4px 4px 0 var(--shadow)}
.face.front{background:var(--card)}
.face.front h3{font-size:1.35rem}
.face.front .label{color:var(--on-tone-muted);font-size:.6rem}
.face.back{background:var(--tone);transform:rotateY(180deg);font-size:.88rem;line-height:1.45;text-align:left}
.face.back b{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--on-tone-muted)}
.face p{margin:0}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}

/* Archive and passport */
.passport{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border:1.5px dashed var(--ink);padding:12px 16px;background:var(--paper)}
.passport strong{font-family:var(--display);font-size:1.2rem}
.stamps{display:flex;gap:6px;flex-wrap:wrap}
.stamps i{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--muted)}
.stamps i.on{border:2px solid var(--pink-deep);background:radial-gradient(circle,var(--pink) 45%,transparent 46%)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{aspect-ratio:3/4;max-width:100%;border:1.5px solid var(--on-tone);display:grid;grid-template-rows:auto 1fr auto auto auto;gap:6px;padding:14px 12px;text-align:center;color:var(--on-tone);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(42,26,48,.45);pointer-events:none}
.card .label{color:var(--on-tone-muted);font-size:.58rem}
.card h3{align-self:center;font-size:1.25rem;overflow-wrap:anywhere;padding-inline:4px}
.card .foot{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-tone-muted)}
.card .was{position:relative;z-index:1;justify-self:center;border:1.5px solid var(--on-tone);background:transparent;color:var(--on-tone);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;cursor:pointer}
.card .was[aria-pressed="true"]{background:var(--on-tone);color:#FDF7EE}
.card.stamped::after{content:"ATTENDED";position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:2.5px solid #A8324F;color:#A8324F;font-size:.72rem;letter-spacing:.24em;padding:4px 10px;opacity:.75;pointer-events:none}
.card.c0{background:#F3C9D2}.card.c1{background:#F1D58A}.card.c2{background:#A9CBEA}.card.c3{background:#CDBEEB}.card.c4{background:#F6E6C8}.card.c5{background:#F4B8A6}

/* Building and charter */
.building{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:760px){.building{grid-template-columns:260px minmax(0,1fr);align-items:start}}
.facade{border:2px solid var(--on-tone);background:var(--cream);padding:10px;display:grid;gap:8px}
.facade .roof{text-align:center;font-family:var(--display);font-size:1.4rem;border-bottom:2px solid var(--on-tone);padding-bottom:6px}
.floor{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--on-tone);background:var(--card);color:var(--on-tone);padding:10px}
.floor .win{display:flex;gap:4px}
.floor .win i{width:12px;height:16px;border:1.5px solid var(--on-tone);border-radius:6px 6px 0 0;background:#F2C35E;animation:lights 6s infinite}
.floor:nth-of-type(2) .win i{animation-delay:-2s}.floor:nth-of-type(3) .win i{animation-delay:-4s}
.floor .win i:nth-child(2){animation-delay:-1s}.floor .win i:nth-child(3){animation-delay:-3s}
@keyframes lights{0%,60%{background:#F2C35E}70%,100%{background:var(--card)}}
.floor small{display:block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--on-tone-muted)}
.floor span{font-weight:500;font-size:.92rem}
.door{height:30px;width:44px;justify-self:center;border:2px solid var(--on-tone);border-bottom:0;border-radius:22px 22px 0 0;background:var(--pink-deep)}
.charter{min-width:0;display:grid;gap:14px}
.charter h3{font-size:1.6rem}
.charter p{margin:0;max-width:60ch}
.articles{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media (min-width:1000px){.articles{grid-template-columns:1fr 1fr}}
.articles li{border-top:1.5px solid var(--on-tone);padding-top:10px;display:grid;gap:2px}
.articles b{font-family:var(--display);font-size:1.1rem}
.articles small{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--on-tone-muted)}

footer{text-align:center;display:grid;gap:6px;justify-items:center}
footer p{margin:0;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.js section.reveal,.js .titlecard,.js .marquee{opacity:1!important;transform:none!important}}
</style>

<script>
(function(){
var S=SETTINGS, n=S.next||{};
var SITE_URL="https://99b-collective.github.io/";
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function when(d,t){if(!d)return null;var x=new Date(d+'T'+(t||'18:00')+':00+05:30');return isNaN(x)?null:x}
function fmtDate(x,o){return x.toLocaleDateString('en-IN',Object.assign({timeZone:'Asia/Kolkata'},o))}
function fmtTime(x){return x.toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit'})}
function hash(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function load(k,d){try{var v=localStorage.getItem('99b:'+k);return v==null?d:v}catch(e){return d}}
function keep(k,v){try{localStorage.setItem('99b:'+k,v)}catch(e){}}

var ui={lang:'All',seat:load('seat',''),name:load('name','')};
var stamps={};try{stamps=JSON.parse(load('stamps','{}'))||{}}catch(e){stamps={}}
var nextAt=when(n.date,n.time), hasNext=!!n.title;

function formButton(label){
  if(S.formUrl)return '<a class="btn solid" href="'+esc(S.formUrl)+'" target="_blank" rel="noopener">'+label+'</a>';
  return '<span class="btn" aria-disabled="true">Form link coming soon</span>';
}
function calUrl(f,at){
  var end=new Date(at.getTime()+150*60000);
  function z(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('99B Collective screening: '+f.title)+'&dates='+z(at)+'/'+z(end)+
    '&location='+encodeURIComponent(f.venue||n.venue||'Building 99B, IIT Delhi')+'&details='+encodeURIComponent((f.theme?'Theme: '+f.theme+'. ':'')+'More at '+SITE_URL);
}
function icsButton(f,at){
  var end=new Date(at.getTime()+150*60000);
  function z(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//99B Collective//EN','BEGIN:VEVENT','UID:'+z(at)+'-99b@99b-collective','DTSTAMP:'+z(new Date()),'DTSTART:'+z(at),'DTEND:'+z(end),
    'SUMMARY:99B Collective screening: '+f.title,'LOCATION:'+(f.venue||'Building 99B, IIT Delhi').replace(/,/g,'\\,'),'DESCRIPTION:'+(SITE_URL),
    'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:Screening in one hour','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  return '<a class="btn" href="data:text/calendar;charset=utf-8,'+encodeURIComponent(ics)+'" download="99b-screening.ics">Apple / Outlook calendar</a>';
}
function calButton(f,at,cls){
  if(!at)return '';
  return '<a class="btn '+(cls||'')+'" href="'+calUrl(f,at)+'" target="_blank" rel="noopener">Add to Google Calendar</a>';
}
function shareButton(){
  var msg=hasNext?('Film night at 99B: '+n.title+(nextAt?', '+fmtDate(nextAt,{weekday:'short',day:'numeric',month:'short'})+' at '+fmtTime(nextAt):'')+'. Details: '):'The 99B Collective film club: ';
  return '<a class="btn" href="https://wa.me/?text='+encodeURIComponent(msg+SITE_URL)+'" target="_blank" rel="noopener">Share on WhatsApp</a>';
}
function registerButton(cls){return S.registerUrl?'<a class="btn '+(cls||'')+'" href="'+esc(S.registerUrl)+'" target="_blank" rel="noopener">Register, it\'s free</a>':''}
function alertsButton(cls){return S.alertsUrl?'<a class="btn '+(cls||'')+'" href="'+esc(S.alertsUrl)+'" target="_blank" rel="noopener">Get screening alerts</a>':''}
function findingUs(){var f=S.findingUs||{};if(!f.room)return '';
  return '<div class="finding"><span class="label">Finding us</span><b>'+esc(f.room)+'</b>'+(f.floor?'<span>'+esc(f.floor)+', Building 99B</span>':'')+(f.directions?'<p>'+esc(f.directions)+'</p>':'')+'</div>'}
function head(title,text){return '<div class="head"><h2>'+title+'</h2>'+(text?'<p>'+text+'</p>':'')+'</div>'}

function masthead(){
  return '<header class="masthead" id="top"><div class="awning" aria-hidden="true"></div><div class="hero">'+
  '<div class="titlecard"><span class="label">A Film Club of Building 99B · IIT Delhi</span><h1>The <em>99B</em> Collective</h1><div class="rule"><span>✦</span></div><span class="label">Design · Mathematics · Public Policy</span></div>'+
  '<div class="marquee" role="status"><span class="label">Now showing</span><strong>'+(hasNext?esc(n.title):'Next picture to be announced')+'</strong>'+
  '<span class="label">'+(nextAt?esc(fmtDate(nextAt,{weekday:'short',day:'numeric',month:'short'}))+' · '+esc(fmtTime(nextAt)):'Date to be announced')+'</span>'+
  '<div class="row" style="justify-content:center">'+registerButton('small reg')+(nextAt?calButton(n,nextAt,'small'):'')+alertsButton('small')+'</div></div></div>'+
  '<nav class="nav" id="nav" aria-label="Sections"><a class="mark" href="#top" aria-label="Back to top">The <em>99B</em></a><div class="navlinks"><a href="#showing">Now Showing</a><a href="#programme">Programme</a><a href="#suggest">Suggest a Film</a><a href="#invite">Bring a Friend</a><a href="#tickets">Tickets</a><a href="#bingo">Bingo</a><a href="#talk">After the Film</a><a href="#glossary">Glossary</a><a href="#archive">Archive</a><a href="#crew">Join the Crew</a><a href="#charter">Charter</a></div></nav></header>';
}
function showing(){
  var body;
  if(!hasNext){body='<div class="empty"><span class="big">The projector is warming up.</span><span>The next screening will be announced here.</span>'+formButton('Suggest a film')+'</div>'}
  else{
    var facts=[['Date',nextAt?fmtDate(nextAt,{weekday:'long',day:'numeric',month:'long'}):'To be announced'],['Time',nextAt?fmtTime(nextAt):''],['Venue',n.venue],['Language',n.language],['Theme',n.theme]].filter(function(f){return f[1]});
    body='<div class="showing" style="display:grid;gap:18px"><div class="scene" data-parallax aria-hidden="true"><svg viewBox="0 0 800 340" preserveAspectRatio="xMidYMid slice">'+pitchScene('N')+'</svg><span class="scene-tag">Illustration</span></div><div><span class="label">'+esc([n.year,n.director].filter(Boolean).join(' · '))+'</span><h3>'+esc(n.title)+'</h3></div>'+
    (n.blurb?'<p style="margin:0">'+esc(n.blurb)+'</p>':'')+
    '<dl class="facts">'+facts.map(function(f){return '<div><dt>'+f[0]+'</dt><dd>'+esc(f[1])+'</dd></div>'}).join('')+'</dl>'+
    (n.refreshments?'<p class="hint" style="font-size:.92rem">'+esc(n.refreshments)+'</p>':'')+
    (nextAt?'<div class="countdown" id="cd"></div><p class="status-line" id="cd-line"></p>':'')+
    findingUs()+
    (n.where?'<span class="legal">Screened legally via '+esc(n.where)+'</span>':'')+
    (S.registerUrl?'<div class="register"><div><b>Register for a seat</b><span>Free. Refreshments are optional (₹40) and you can choose them after registering.</span></div>'+registerButton('solid')+'</div>':'')+
    '<div class="row">'+(nextAt?calButton(n,nextAt,S.registerUrl?'':'solid')+icsButton(n,nextAt):'')+shareButton()+alertsButton()+'</div>'+
    (nextAt?'':'<p class="hint">The calendar button appears once the date is confirmed.</p>')+'</div>';
  }
  return '<section class="t-pink" id="showing">'+head('Now Showing','The next picture, the time, and the room. Bring a friend.')+'<div class="panel">'+body+'</div></section>';
}
function programme(){
  var items=(S.programme||[]).slice().sort(function(a,b){return (a.date||'9')<(b.date||'9')?-1:1});
  var all=(hasNext?[Object.assign({next:true},n)]:[]).concat(items);
  var langs=['All'];all.forEach(function(p){var l=(p.language||'').split(',')[0];if(l&&langs.indexOf(l)<0)langs.push(l)});
  var shown=all.filter(function(p){return ui.lang==='All'||(p.language||'').split(',')[0]===ui.lang});
  var frames=shown.map(function(p,i){var d=when(p.date,p.time);
    return '<li class="frame c'+(hash(p.title)%6)+(p.next?' is-next':'')+'">'+(p.next?'<span class="flag">Next up</span>':'')+

/* ---------- Interlude: walking to 99B, in folded paper ---------- */
function fold(pts,a,b){ /* a shape folded down its middle: two polygons in a light and a shaded tone */
  return '<polygon points="'+pts[0]+'" fill="'+a+'"/><polygon points="'+pts[1]+'" fill="'+b+'"/>';
}
function paperTree(x,s,light,dark,i){
  return '<g transform="translate('+x+' 216) scale('+s+')"><g class="ptree" style="animation-delay:'+(-i*1.7)+'s">'+
    '<rect x="-3" y="-26" width="6" height="26" fill="#6E4A5E"/>'+
    fold(['0,-118 -24,-74 0,-80','0,-118 0,-80 24,-74'],light,dark)+
    fold(['0,-92 -32,-30 0,-38','0,-92 0,-38 32,-30'],light,dark)+
  '</g></g>';
}
function crane(c1,c2){
  return '<g class="crane"><g class="wing w1">'+fold(['0,0 -26,-22 -6,-2','0,0 -6,-2 -10,6'],c1,c2)+'</g>'+
    fold(['-14,4 0,0 14,4 0,8','0,0 14,4 0,8'],c1,c2)+'<polygon points="14,4 26,-8 22,6" fill="'+c2+'"/><polygon points="-14,4 -24,-2 -18,6" fill="'+c1+'"/>'+
    '<g class="wing w2">'+fold(['0,0 20,-24 6,-2','0,0 6,-2 10,6'],c2,c1)+'</g></g>';
}
function paperPerson(i){
  var P=[['#F3C9D2','#D98AA4'],['#A9CBEA','#6F97C4'],['#F1D58A','#D4A94B'],['#CDBEEB','#9D86D6'],['#F4B8A6','#D9826B'],['#2F4A7A','#1F3358']][i%6];
  var hairs=[['-10,-80 0,-91 0,-80','0,-91 10,-80 0,-80'],['-11,-79 0,-92 11,-79','-11,-79 11,-79 13,-76'],['-11,-80 0,-90 0,-60 -12,-62','0,-90 11,-80 12,-62 0,-60'],['-10,-80 -4,-92 4,-92 10,-80','-4,-92 4,-92 0,-86']][i%4];
  var cup=i%3===0?'<g class="pcup"><polygon points="14,-46 22,-46 21,-36 15,-36" fill="#FDF7EE"/><polygon points="18,-46 22,-46 21,-36 18,-36" fill="#E9DCCB"/><path class="steam" d="M17 -50 q2 -4 0 -7 M20 -50 q2 -4 0 -7" stroke="#B9A8C8" stroke-width="1" fill="none"/></g>':'';
  return '<svg viewBox="-30 -100 60 104">'+
    '<ellipse cx="0" cy="2" rx="14" ry="2.6" fill="#3A2440" opacity=".14"/>'+
    '<g class="pleg pl1"><polygon points="-7,-24 -1,-24 -2,0 -7,0" fill="#3A2440"/></g><g class="pleg pl2"><polygon points="1,-24 7,-24 7,0 2,0" fill="#2A1A30"/></g>'+
    fold(['-10,-62 0,-62 0,-22 -17,-22','0,-62 10,-62 17,-22 0,-22'],P[0],P[1])+
    '<polygon points="-6,-62 6,-62 0,-53" fill="#FDF7EE"/>'+
    fold(['0,-82 -9,-77 -9,-67 0,-62','0,-82 9,-77 9,-67 0,-62'],'#E8BE9C','#CF9C78')+
    '<g fill="#3A2440">'+'<polygon points="'+hairs[0]+'" fill="#3A2440"/><polygon points="'+hairs[1]+'" fill="#24152B"/></g>'+cup+
  '</svg>';
}
function walkers(){
  var people='';for(var i=0;i<7;i++){people+='<div class="pwalker" style="--d:'+(18+(i%3)*4)+'s;--delay:'+(-i*3.1)+'s;--s:'+(i%2?1:.92)+'">'+paperPerson(i)+'</div>'}
  var sun='';for(var k=0;k<8;k++){var a1=k*45*Math.PI/180,a2=(k*45+45)*Math.PI/180;sun+='<polygon points="0,0 '+(Math.cos(a1)*34).toFixed(1)+','+(Math.sin(a1)*34).toFixed(1)+' '+(Math.cos(a2)*34).toFixed(1)+','+(Math.sin(a2)*34).toFixed(1)+'" fill="'+(k%2?'#E7A645':'#F6C46E')+'"/>'}
  var back='<svg class="pscene" viewBox="0 0 960 240" preserveAspectRatio="xMidYMax meet">'+
    '<g transform="translate(400 58)"><g class="psun">'+sun+'</g></g>'+
    '<g class="cranes"><g class="cr c1" transform="translate(0 0)">'+crane('#FDF7EE','#E5D6EE')+'</g></g>'+
    '<g class="cranes slow"><g class="cr c2">'+crane('#F3C9D2','#D98AA4')+'</g></g>'+
    paperTree(90,1.05,'#F3C9D2','#D98AA4',4)+paperTree(250,1.3,'#CDBEEB','#9D86D6',0)+paperTree(296,.85,'#F3C9D2','#D98AA4',1)+paperTree(540,1.05,'#F3C9D2','#D98AA4',2)+paperTree(592,1.4,'#CDBEEB','#9D86D6',3)+paperTree(700,.9,'#F1D58A','#D4A94B',5)+
    '<polygon points="0,216 960,216 960,226 0,226" fill="#F6E6C8"/><polygon points="0,226 960,226 960,240 0,240" fill="#E7CFA8"/>'+
  '</svg>';
  var win=function(x,y){return fold([x+','+y+' '+(x+22)+','+y+' '+x+','+(y+22),(x+22)+','+y+' '+(x+22)+','+(y+22)+' '+x+','+(y+22)],'#F6C46E','#E7A645')};
  var front='<svg class="pscene front" viewBox="0 0 960 240" preserveAspectRatio="xMidYMax meet">'+
    '<g transform="translate(790 216)">'+
      '<polygon points="-26,-150 0,-160 0,0 -26,-6" fill="#E3C79C"/>'+
      '<rect x="0" y="-160" width="140" height="160" fill="#FBEBD3"/>'+
      fold(['-30,-158 70,-206 70,-160','70,-206 146,-158 70,-160'],'#F3C9D2','#D98AA4')+
      '<polygon points="-30,-158 0,-160 70,-160 -2,-150" fill="#C24A72" opacity=".25"/>'+
      '<text x="70" y="-170" text-anchor="middle" font-family="Bodoni Moda,Georgia,serif" font-weight="600" font-size="20" fill="#3A2440">99B</text>'+
      win(16,-146)+win(52,-146)+win(88,-146)+win(16,-108)+win(102,-108)+
      '<g class="pdoor">'+fold(['52,0 52,-58 70,-74 70,0','70,-74 88,-58 88,0 70,0'],'#C24A72','#9E3359')+'</g>'+
      '<polygon points="44,0 96,0 100,6 40,6" fill="#E7CFA8"/>'+
    '</g></svg>';
  return '<div class="interlude walk" aria-hidden="true"><div class="street">'+back+people+front+'</div></div>';
}

function render(){
  document.getElementById('app').innerHTML='<div class="wrap">'+masthead()+
  showing()+invite()+programme()+suggest()+tickets()+
  bingoSection()+talk()+glossary()+archive()+crew()+walkers()+charter()+
  '<footer><div class="rule"><span>✦</span></div><p>The 99B Collective · Film club at IIT Delhi</p><p>All films are screened from legal sources.</p>'+(S.alertsUrl?'<div class="row" style="justify-content:center">'+alertsButton()+'</div>':'')+'</footer></div>';
  document.getElementById('ticket').innerHTML=ticketHTML();
  updateInvite();bingoStatus();showQ();crewUpdate();
  tick();
}
function tick(){
  var cd=document.getElementById('cd');if(!cd||!nextAt)return;
  var ms=nextAt-Date.now(),line=document.getElementById('cd-line');
  if(ms>0){var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
    var vals=[d,h,m,sec],names=['Days','Hours','Minutes','Seconds'];
    if(!cd.children.length)cd.innerHTML=names.map(function(nm){return '<div><b></b><span>'+nm+'</span></div>'}).join('');
    var bs=cd.querySelectorAll('b');vals.forEach(function(v,i){var t=String(v).padStart(2,'0');if(bs[i].textContent!==t){bs[i].textContent=t;bs[i].classList.remove('tickflip');void bs[i].offsetWidth;bs[i].classList.add('tickflip')}});
    line.textContent=d===0?'Tonight. Save a seat for a friend.':'Until the lights go down.';cd.hidden=false}
  else{cd.hidden=true;line.textContent=ms>-3*3600000?'Showing now. Come in quietly.':'This screening has happened. The next one will be announced soon.'}
}
setInterval(tick,1000);

document.addEventListener('click',function(e){
  var sn=e.target.closest('[data-strip]');if(sn){var st2=document.getElementById('strip');st2.scrollBy({left:(+sn.getAttribute('data-strip'))*st2.clientWidth*.8,behavior:'smooth'});return}
  var c=e.target.closest('[data-lang]');if(c){ui.lang=c.getAttribute('data-lang');document.getElementById('programme').outerHTML=programme();stripArrows();return}
  var s=e.target.closest('[data-seat]');if(s){ui.seat=s.getAttribute('data-seat');keep('seat',ui.seat);document.querySelectorAll('[data-seat]').forEach(function(b){b.setAttribute('aria-pressed',String(b===s))});document.getElementById('ticket').innerHTML=ticketHTML();return}
  var f=e.target.closest('[data-flip]');if(f){var on=f.getAttribute('aria-pressed')!=='true';f.setAttribute('aria-pressed',String(on));return}
  var sq=e.target.closest('[data-sq]');if(sq){var k=sq.getAttribute('data-sq');if(bingo[k])delete bingo[k];else bingo[k]=1;sq.setAttribute('aria-pressed',String(!!bingo[k]));keep(bingoKey,JSON.stringify(bingo));bingoStatus();return}
  if(e.target.id==='bingo-reset'){bingo={};keep(bingoKey,'{}');document.querySelectorAll('[data-sq]').forEach(function(b){b.setAttribute('aria-pressed','false')});bingoStatus();return}
  var ro=e.target.closest('[data-role]');if(ro){var ri=ro.getAttribute('data-role');if(crewPick[ri])delete crewPick[ri];else crewPick[ri]=1;ro.setAttribute('aria-pressed',String(!!crewPick[ri]));crewUpdate();return}
  if(e.target.id==='q-next'){qPos++;if(qPos>=qOrder.length)shuffleQs();showQ();return}
  if(e.target.id==='invite-copy'){var t=document.getElementById('invite-text').textContent,stat=document.getElementById('invite-status');
    function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('invite-text'));var s=getSelection();s.removeAllRanges();s.addRange(r);stat.textContent='Message selected. Press copy to finish.'}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){stat.textContent='Copied.'},fallback)}else fallback();return}
  var st=e.target.closest('[data-stamp]');if(st){var t=st.getAttribute('data-stamp');if(stamps[t])delete stamps[t];else stamps[t]=1;keep('stamps',JSON.stringify(stamps));document.getElementById('archive').outerHTML=archive()}
});
document.addEventListener('input',function(e){if(e.target.id==='invite-name'){updateInvite();document.getElementById('invite-status').textContent='';return}if(e.target.id==='ticket-name'){ui.name=e.target.value.trim();keep('name',ui.name);document.getElementById('ticket').innerHTML=ticketHTML()}});
document.addEventListener('submit',function(e){
  if(e.target.id!=='check-form')return;e.preventDefault();
  var t=document.getElementById('check-title').value.trim(),box=document.getElementById('check-links');if(!t){box.hidden=true;return}
  var q=encodeURIComponent(t);
  box.innerHTML='<a href="https://www.justwatch.com/in/search?q='+q+'" target="_blank" rel="noopener">JustWatch India (all platforms)</a>'+
  '<a href="https://mubi.com/en/in/search/films?query='+q+'" target="_blank" rel="noopener">MUBI</a>'+
  '<a href="https://www.google.com/search?q='+encodeURIComponent('where to watch '+t+' India')+'" target="_blank" rel="noopener">Google: where to watch in India</a>';
  box.hidden=false;
});
document.documentElement.classList.add('js');
setTimeout(function(){document.body.classList.add('ready')},4000);
render();

/* Phone action bar */
(function(){
  if(!hasNext)return;
  var act=S.registerUrl?'<a class="btn" href="'+esc(S.registerUrl)+'" target="_blank" rel="noopener">Register</a>':(nextAt?'<a class="btn" href="'+calUrl(n,nextAt)+'" target="_blank" rel="noopener">Add to calendar</a>':'');
  var dk=document.createElement('div');dk.className='dock';dk.setAttribute('aria-hidden','true');
  dk.innerHTML='<div><span>Next screening</span><b>'+esc(n.title)+'</b><span>'+(nextAt?esc(fmtDate(nextAt,{weekday:'short',day:'numeric',month:'short'}))+' · '+esc(fmtTime(nextAt)):'Date to be announced')+'</span></div>'+act;
  document.body.appendChild(dk);
  var showing=document.getElementById('showing');
  function upd(){var y=scrollY,past=showing&&showing.getBoundingClientRect().bottom<0,nearEnd=innerHeight+y>document.documentElement.scrollHeight-260;
    var on=past&&!nearEnd;dk.classList.toggle('show',on);dk.setAttribute('aria-hidden',String(!on))}
  addEventListener('scroll',upd,{passive:true});upd();
})();

/* Sticky nav: brand mark, current section, keep the active link in view */
(function(){
  var nav=document.getElementById('nav');if(!nav)return;
  var links=[].slice.call(nav.querySelectorAll('.navlinks a')),strip=nav.querySelector('.navlinks');
  function stuck(){nav.classList.toggle('stuck',nav.getBoundingClientRect().top<=1&&scrollY>200)}
  addEventListener('scroll',stuck,{passive:true});stuck();
  if(!('IntersectionObserver' in window))return;
  var current='';
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting)current=en.target.id});
    links.forEach(function(a){var on=a.getAttribute('href')==='#'+current;a.setAttribute('aria-current',String(on));
      if(on){var l=a.offsetLeft-strip.offsetLeft,w=a.offsetWidth;if(l<strip.scrollLeft||l+w>strip.scrollLeft+strip.clientWidth)strip.scrollTo({left:l-24,behavior:'smooth'})}});
  },{rootMargin:'-45% 0px -50% 0px'});
  links.forEach(function(a){var t=document.querySelector(a.getAttribute('href'));if(t)io.observe(t)});
})();

/* Sections rise in as you reach them */
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||!('IntersectionObserver' in window))return;
  var secs=[].slice.call(document.querySelectorAll('.wrap section'));
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'});
  secs.forEach(function(s){var r=s.getBoundingClientRect();if(r.top>innerHeight){s.classList.add('reveal');io.observe(s)}});
})();

/* Film strip arrows only when there is somewhere to go */
function stripArrows(){var st=document.getElementById('strip');if(!st)return;var max=st.scrollWidth-st.clientWidth-2;
  document.querySelectorAll('[data-strip]').forEach(function(b){var dir=+b.getAttribute('data-strip');b.style.visibility=(dir<0?st.scrollLeft>2:st.scrollLeft<max)?'visible':'hidden'})}
document.addEventListener('scroll',function(e){if(e.target&&e.target.id==='strip')stripArrows()},true);
addEventListener('resize',stripArrows);stripArrows();
new MutationObserver(stripArrows).observe(document.getElementById('app'),{childList:true,subtree:false});
/* Cards tilt toward the pointer; scenes shift in layers */
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hover=window.matchMedia&&matchMedia('(hover:hover)').matches;
  if(reduce||!hover)return;
  var SEL='.frame,.card,.ticket,.polaroid,.qcard,.role,.tally div';
  document.addEventListener('pointermove',function(e){
    var el=e.target.closest(SEL);
    document.querySelectorAll('.tilting').forEach(function(t){if(t!==el){t.classList.remove('tilting');t.style.transform=''}});
    if(el){var r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      el.classList.add('tiltable','tilting');el.style.setProperty('--mx',(x*100)+'%');el.style.setProperty('--my',(y*100)+'%');
      var base=el.classList.contains('polaroid')?' rotate(var(--tilt))':'';
      el.style.transform='perspective(900px) rotateX('+((.5-y)*9).toFixed(2)+'deg) rotateY('+((x-.5)*11).toFixed(2)+'deg) translateY(-4px)'+base}
    var sc=e.target.closest('[data-parallax]');
    document.querySelectorAll('[data-parallax]').forEach(function(p){if(p!==sc)p.style.setProperty('--px',0)});
    if(sc){var rr=sc.getBoundingClientRect();sc.style.setProperty('--px',(((e.clientX-rr.left)/rr.width-.5)*-2).toFixed(3))}
  },{passive:true});
  document.addEventListener('pointerleave',function(){document.querySelectorAll('.tilting').forEach(function(t){t.classList.remove('tilting');t.style.transform=''})});
})();
/* On phones the scene drifts gently as you scroll */
(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(window.matchMedia&&matchMedia('(hover:hover)').matches)return;
  addEventListener('scroll',function(){document.querySelectorAll('[data-parallax]').forEach(function(p){var r=p.getBoundingClientRect();var v=((r.top+r.height/2)/innerHeight-.5)*2;p.style.setProperty('--px',Math.max(-1.5,Math.min(1.5,v)).toFixed(3))})},{passive:true});
})();

/* Drag the film strip with a mouse */
document.addEventListener('mousedown',function(e){
  var st=e.target.closest('#strip');if(!st||e.target.closest('a,button'))return;
  var x0=e.pageX,s0=st.scrollLeft,moved=false;st.style.scrollSnapType='none';st.style.cursor='grabbing';
  function mv(ev){var dx=ev.pageX-x0;if(Math.abs(dx)>3)moved=true;st.scrollLeft=s0-dx}
  function up(){removeEventListener('mousemove',mv);removeEventListener('mouseup',up);st.style.scrollSnapType='';st.style.cursor=''}
  addEventListener('mousemove',mv);addEventListener('mouseup',up);
});

/* Opening leader: plays once per visit, skipped for reduced motion */
(function(){
  var seen=false;try{seen=sessionStorage.getItem('99b:leader')==='1'}catch(e){}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ready(){document.body.classList.add('ready')}
  if(seen||reduce){requestAnimationFrame(ready);return}
  try{sessionStorage.setItem('99b:leader','1')}catch(e){}
  var L=document.createElement('div');L.className='leader';L.setAttribute('role','presentation');
  L.innerHTML='<span class="cap">The 99B Collective presents</span><div class="dial"><span class="cross"></span><span class="num">3</span></div><button class="skip" type="button">Skip</button>';
  document.body.appendChild(L);
  var dial=L.querySelector('.dial'),num=L.querySelector('.num'),count=3,start=performance.now(),done=false;
  function end(){if(done)return;done=true;L.classList.add('out');setTimeout(ready,150);setTimeout(function(){L.remove()},550)}
  L.querySelector('.skip').addEventListener('click',end);
  function frame(t){if(done)return;var el=(t-start)/700,k=Math.floor(el),f=el-k;
    if(k>=3){end();return}
    if(3-k!==count){count=3-k;num.textContent=count}
    dial.style.setProperty('--sweep',(f*360)+'deg');requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
})();
})();
</script>
