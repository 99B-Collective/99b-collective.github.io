<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost reel · 99B Collective</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;1,6..96,500&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#DDE9F3;--paper:#FDF7EE;--ink:#3A2440;--muted:#6E5C74;--pink:#C24A72;--navy:#2F3A63}
@media (prefers-color-scheme:dark){:root{--bg:#22283F;--paper:#2F3552;--ink:#F4E9F0;--muted:#C4BCD4;--pink:#F08DAE}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Jost,Futura,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{max-width:520px;width:100%;background:var(--paper);border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-8px;padding:44px 24px;text-align:center;display:grid;gap:14px}
.label{text-transform:uppercase;letter-spacing:.24em;font-size:.72rem;color:var(--muted)}
h1{margin:0;font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.05}
h1 em{color:var(--pink)}
p{margin:0;color:var(--muted)}
a{justify-self:center;margin-top:8px;display:inline-block;background:var(--navy);color:#FDF7EE;text-decoration:none;padding:12px 20px;text-transform:uppercase;letter-spacing:.16em;font-size:.76rem}
</style></head><body>
<div class="card"><span class="label">Reel 404</span><h1>This reel <em>is missing</em></h1><p>The page you were looking for isn't in the projection booth. The screening is still on.</p><a href="/">Back to the 99B Collective</a></div>
</body></html>
